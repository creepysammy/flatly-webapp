<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flatly-Registrati</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="auth-card">
            <h1>Crea Account</h1>
            <p class="subtitle">Registrati per gestire la tua casa</p>

            <form id="form-register">
                <div class="form-group">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" required placeholder="Inserisci il tuo nome">
                </div>

                <div class="form-group">
                    <label for="cognome">Cognome</label>
                    <input type="text" id="cognome" required placeholder="Inserisci il tuo cognome">
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required placeholder="Inserisci la tua email">
                </div>

                <div class="form-group">
                    <label for="password">Password (min. 6 caratteri)</label>
                    <input type="password" id="password" required minlength="6">
                </div>

                <div class="form-group">
                    <label for="confirm-password">Conferma Password</label>
                    <input type="password" id="confirm-password" required minlength="6">
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="privacy" required>
                    <label for="privacy" style="font-weight:400;">
                        Accetto l'<a href="privacy.html" target="_blank">informativa sulla privacy</a>
                    </label>"
                </div> 

                <button type="submit" class="btn">Crea Account</button>
            </form>

            <div id="errore" class="errore"></div>

            <div class="links">
                <span>Hai già un account? <a href="index.html">Accedi</a></span>
        </div>
    </div>
    <script type="module" src="js/auth.js"></script>
</body>
</html>
