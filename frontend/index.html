<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flatly-Accedi</title>
    <link rel="stylesheet" href="css/syle.css">

</head>
<body>
    <div class="container">
    <div class="auth-card">
    <h1>Flatly</h1>
    <p class="subtitle">Accedi per gestire la tua casa</p>

    <form id="form-login">
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" required placeholder="name@esempio.it">
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" required placeholder="**************">
        </div>

        <button type="submit" id="btn-accedi" class="btn">Accedi</button>  
    </form>

    <div id="errore" class="errore"></div>
   <div id="successo" class="msg-success" style="display: none; margin-top: 14px; padding: 10px; border-radius: 8px; background-color: #dcfce7; color: #16a34a; font-size: 0.9rem;"></div>
    <div class="links">
        <a href="#" id="link-reset">Password dimenticata?</a>
        <span>Non hai un account? <a href="register.html">Registrati</a></span>
    </div>
    </div>
</div>

<script type="module" src="js/auth.js"></script>
</body>
</html>
